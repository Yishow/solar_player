name: Agent remaining verification

on:
  push:
    branches:
      - agent/issue-5-default-playback-profile
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  main-web-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.33.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @solar-display/shared build
      - name: Main web baseline
        run: pnpm --filter @solar-display/web test

  branch-web-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.33.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @solar-display/shared build
      - name: Branch web regression
        run: pnpm --filter @solar-display/web test

  branch-script-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.33.2 --activate
      - run: pnpm install --frozen-lockfile
      - name: Verify deployment scripts
        run: node --test scripts/deploy.test.mjs
      - name: Verify test and root verification runners
        run: node --test apps/server/scripts/run-tests.test.mjs scripts/verify.test.mjs
